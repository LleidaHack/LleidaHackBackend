name: Code Quality

on:
  pull_request:
    branches: 
      - main
      - integration
    paths:
      - '**.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: uv tool install ruff

      - name: Lint with ruff
        run: uv tool run ruff check .

      - name: Format with ruff
        run: uv tool run ruff format --check .
