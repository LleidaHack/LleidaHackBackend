name: Validate and prepare Docker release

on:
  push:
    branches: [main, integration]
  workflow_dispatch:

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
  tests:
    uses: ./.github/workflows/tests.yml
  prepare:
    # A merge validates code; a manual run builds a candidate only.
    # Cutover is coordinated with backup, mail and frontends (see release docs).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [tests, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare tested commit on Docker host
        uses: appleboy/ssh-action@d91a1af6f57cd4478ceee14d7705601dafabaa19
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            umask 077
            SHA='${{ github.sha }}'
            ROOT=/root/LleidaHackWeb/releases/backend
            mkdir -p "$ROOT"
            exec 9>"$ROOT/.prepare.lock"
            flock -n 9
            SOURCE="$ROOT/$SHA/source"
            if [ ! -d "$SOURCE/.git" ]; then
              git clone --no-checkout https://github.com/LleidaHack/LleidaHackBackend.git "$SOURCE"
              git -C "$SOURCE" checkout --detach "$SHA"
            fi
            cd "$SOURCE"
            test -z "$(git status --porcelain)"
            git fetch origin "$SHA"
            git checkout --detach "$SHA"
            bash deploy/prepare-docker-release.sh "$SHA" "$ROOT/$SHA"
