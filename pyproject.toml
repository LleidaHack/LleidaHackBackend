[project]
name = "lleidahackbackend"
version = "0.1.0"
description = ""
authors = [
    {name = "tonlls"}
]
requires-python = ">=3.12"
dependencies = [
    "openapi-python-client>=0.20.0",
    "fastapi>=0.111.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.1",
    "SQLAlchemy>=2.0.30",
    "FastAPI-SQLAlchemy>=0.2.1",
    "pyjwt[crypto]>=2.13.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.9",
    "configparser>=7.0.0",
    "gunicorn>=22.0.0",
    "uvicorn>=0.30.0",
    "redis>=5,<7",
    "segno>=1.6",
    "pillow>=12.0",
    "pypdf>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]

[tool.ruff]
target-version = "py312"
# Generated from the mail service OpenAPI schema; regenerate instead of editing.
extend-exclude = ["backend/generated_src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency descriptors are intentionally constructed at route registration.
extend-immutable-calls = ["fastapi.Depends", "src.utils.JWTBearer.JWTBearer"]

[tool.ruff.lint.per-file-ignores]
# Existing module names are imported throughout the application; preserve that API.
"**/__init__.py" = ["N999"]
"App.py" = ["N999"]
"src/utils/JWTBearer.py" = ["N999"]
"src/utils/Singleton.py" = ["N999"]
"src/utils/Token.py" = ["N999"]
"src/utils/TokenType.py" = ["N999"]
"src/utils/UserType.py" = ["N999"]
